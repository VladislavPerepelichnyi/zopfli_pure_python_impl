[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zopfli_pure"
version = "0.1.0"
description = "Pure-Python port of Google's Zopfli compressor (reference: google/zopfli)"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }

[tool.setuptools.packages.find]
include = ["zopfli_pure*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: long-running tests (large inputs)",
  "oracle: tests that need the C reference (py-zopfli or the tools/ C harness)",
]
